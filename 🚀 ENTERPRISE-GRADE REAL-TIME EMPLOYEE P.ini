📦 IMPLEMENTATION REQUIREMENTS
1. DATABASE SCHEMA
Create table: employee_presence

CREATE TABLE employee_presence (
  employee_id UUID PRIMARY KEY REFERENCES employees(id) ON DELETE CASCADE,
  status TEXT NOT NULL CHECK (status IN ('working', 'idle', 'break', 'offline')),
  last_activity TIMESTAMPTZ NOT NULL,
  last_heartbeat TIMESTAMPTZ NOT NULL DEFAULT NOW(),
  break_started_at TIMESTAMPTZ,
  updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
);

-- Index for fast offline detection
CREATE INDEX idx_last_heartbeat ON employee_presence(last_heartbeat);

-- Enable Realtime
ALTER PUBLICATION supabase_realtime ADD TABLE employee_presence;

-- Auto-update timestamp trigger
CREATE OR REPLACE FUNCTION update_presence_timestamp()
RETURNS TRIGGER AS $$
BEGIN
  NEW.updated_at = NOW();
  RETURN NEW;
END;
$$ LANGUAGE plpgsql;

CREATE TRIGGER presence_updated_at
BEFORE UPDATE ON employee_presence
FOR EACH ROW EXECUTE FUNCTION update_presence_timestamp();

-- Auto-cleanup stale rows (>5 minutes old)
CREATE OR REPLACE FUNCTION cleanup_stale_presence()
RETURNS void AS $$
BEGIN
  DELETE FROM employee_presence
  WHERE last_heartbeat < NOW() - INTERVAL '5 minutes';
END;
$$ LANGUAGE plpgsql;

-- Schedule cleanup (requires pg_cron extension)
SELECT cron.schedule(
  'cleanup-stale-presence',
  '60 seconds',
  'SELECT cleanup_stale_presence()'
);
