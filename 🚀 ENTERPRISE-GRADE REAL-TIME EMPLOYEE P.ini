6. STATUS ENGINE LOGIC
Backend (runs every 60s via cron or API call):

// Update offline status
UPDATE employee_presence
SET status = 'offline'
WHERE last_heartbeat < NOW() - INTERVAL '90 seconds'
  AND status != 'offline';

// Update idle status
UPDATE employee_presence
SET status = 'idle'
WHERE last_activity < NOW() - INTERVAL '5 minutes'
  AND status = 'working';
Frontend (runs on heartbeat):

// Determine status based on activity
const now = Date.now();
const timeSinceActivity = now - lastActivity;

if (isBreak) {
  status = 'break';
} else if (timeSinceActivity < 5 * 60 * 1000) {
  status = 'working';
} else {
  status = 'idle';
}
