Client-side subscription:

// Subscribe to employee_presence table updates
const subscription = supabase
  .channel('presence-changes')
  .on(
    'postgres_changes',
    {
      event: 'UPDATE',
      schema: 'public',
      table: 'employee_presence'
    },
    (payload) => {
      // Update UI instantly
      updateEmployeeCard(payload.new);
    }
  )
  .subscribe();
Optimization:

Subscribe only to UPDATE events (not INSERT/DELETE)
Throttle UI updates (max 1 update per second per employee)
Handle reconnection logic
