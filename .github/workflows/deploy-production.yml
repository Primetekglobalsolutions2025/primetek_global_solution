name: Deploy Production (Vercel)

on:
  push:
    branches:
      - main

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Vercel environment variables
        run: |
          echo "VERCEL_ORG_ID=$(echo '${{ secrets.VERCEL_ORG_ID }}' | tr -d '\r\n ')" >> $GITHUB_ENV
          echo "VERCEL_PROJECT_ID=$(echo '${{ secrets.VERCEL_PROJECT_ID }}' | tr -d '\r\n ')" >> $GITHUB_ENV
          echo "VERCEL_TOKEN=$(echo '${{ secrets.VERCEL_TOKEN }}' | tr -d '\r\n ')" >> $GITHUB_ENV

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project for production
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        run: |
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" > deployment_url.txt
          echo "### Vercel Production Deployment Successful 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Deployment URL: $(cat deployment_url.txt)" >> $GITHUB_STEP_SUMMARY
